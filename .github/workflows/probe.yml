name: probe-cwa
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          echo "== radar page"; curl -sL -A "$UA" https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html | grep -oE '/Data/js/[^"]+|/V8/assets/js/observe/[^"]+' | sort -u
          for js in /Data/js/obs_img/Observe_radar.js /Data/js/obs_img/Observe_radar_rain.js; do
            echo "== $js"; curl -sL -A "$UA" "https://www.cwa.gov.tw$js" | head -c 1500; echo
          done
          curl -sL -A "$UA" https://www.cwa.gov.tw/V8/assets/js/observe/function-radar.js | grep -oE '.{0,100}/Data/radar.{0,100}' | head
          echo "== sat js tabs"; curl -sL -A "$UA" https://www.cwa.gov.tw/Data/js/obs_img/Observe_sat.js | grep -oE "'(Tab|Area|size)[0-9]+'|\"img\":'[A-Za-z0-9_]+/" | uniq | head -60
          curl -sL -A "$UA" https://www.cwa.gov.tw/Data/js/obs_img/Observe_sat.js | grep -c img
