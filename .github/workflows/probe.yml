name: probe-cwa
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q pillow numpy
          S3=https://cwaopendata.s3.ap-northeast-1.amazonaws.com/Observation
          R=$(curl -s $S3/O-A0058-003.json | grep -oE '"DateTime": *"[^"]+"' | grep -oE '[0-9]{4}-[0-9-]+T[0-9:]+' )
          S=$(curl -s $S3/O-C0042-002.json | grep -oE '"Datetime": *"[^"]+"' | grep -oE '[0-9]{4}-[0-9-]+T[0-9:]+' )
          echo "radar $R sat $S"
          RT=$(date -d "$R" +%Y%m%d%H%M); ST=$(date -d "$S" +%Y-%m-%d-%H-%M)
          curl -s -A Mozilla/5.0 -o web_radar.png "https://www.cwa.gov.tw/Data/radar/CV1_3600_$RT.png"
          curl -s -o s3_radar.png $S3/O-A0058-003.png
          curl -s -A Mozilla/5.0 -o web_sat.jpg "https://www.cwa.gov.tw/Data/satellite/TWI_IR1_CR_800/TWI_IR1_CR_800-$ST.jpg"
          curl -s -o s3_sat.jpg $S3/O-C0042-002.jpg
          curl -s -A Mozilla/5.0 -o web_vis.jpg "https://www.cwa.gov.tw/Data/satellite/TWI_VIS_Gray_1350/TWI_VIS_Gray_1350-$ST.jpg"
          curl -s -o s3_vis.jpg $S3/O-C0042-008.jpg
          python3 - <<'PY'
          from PIL import Image
          import numpy as np
          def cmp(a,b):
              A=Image.open(a).convert('RGB'); B=Image.open(b).convert('RGB')
              print(a, A.size, b, B.size)
              B2=B.resize(A.size) if B.size!=A.size else B
              d=np.abs(np.asarray(A,dtype=int)-np.asarray(B2,dtype=int)).mean()
              print('  mean abs diff', round(d,2))
              # 找出灰階邊緣的重心以比較是否對齊
              for name,im in ((a,A),(b,B2)):
                  g=np.asarray(im.convert('L'),dtype=float)
                  ex=np.abs(np.diff(g,axis=1)).sum(axis=0); ey=np.abs(np.diff(g,axis=0)).sum(axis=1)
                  print('  ',name,'edge centroid x=%.3f y=%.3f'%((ex*np.arange(len(ex))).sum()/ex.sum()/len(ex),(ey*np.arange(len(ey))).sum()/ey.sum()/len(ey)))
          import base64, io
          for f in ['web_radar.png','s3_radar.png','web_sat.jpg','s3_sat.jpg','web_vis.jpg','s3_vis.jpg']:
              im=Image.open(f).convert('RGB').resize((360,360)); b=io.BytesIO(); im.save(b,'JPEG',quality=70)
              print('B64', f, base64.b64encode(b.getvalue()).decode())
          PY
