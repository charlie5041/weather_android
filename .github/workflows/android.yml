name: Android CI/CD

on:
  push:
    branches: ["**", "!ci-screenshots"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "同時發佈到 Firebase App Tester"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: 設定簽章金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::尚未設定 KEYSTORE_BASE64 secret，改用暫時的 debug 金鑰簽章；手機上將無法直接覆蓋更新。詳見 README。"
          fi

      - name: 設定 Firebase Crashlytics（若有提供 Secret）
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "已啟用 Crashlytics"
          else
            echo "::notice::尚未設定 GOOGLE_SERVICES_JSON，這次建置不含 Crashlytics。"
          fi

      - name: 單元測試、畫面截圖並建置 Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MyWeather-1.0.${VERSION_CODE}.apk"

      - name: 發佈畫面截圖到 ci-screenshots 分支
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          shots=(app/build/screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then echo "沒有截圖"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/shots" && cp "${shots[@]}" "$RUNNER_TEMP/shots/"
          cd "$RUNNER_TEMP/shots"
          echo "Screenshots for ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots


      - name: 檢查 Firebase 服務帳戶金鑰
        id: firebase
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::notice::尚未設定 FIREBASE_SERVICE_ACCOUNT / FIREBASE_APP_ID，略過 App Tester 發佈。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e '.type == "service_account" and (.private_key | startswith("-----BEGIN PRIVATE KEY-----")) and (.client_email | length > 0)' > /dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 不是有效的服務帳戶 JSON。請把下載的 .json 檔『整份內容』（從 { 到 }）貼進 secret。"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: steps.firebase.outputs.enabled == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 發佈到 Firebase App Distribution（App Tester）
        if: steps.firebase.outputs.enabled == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          TESTER_ARGS=()
          if [ -n "$FIREBASE_TESTERS" ]; then TESTER_ARGS=(--testers "$FIREBASE_TESTERS"); fi
          npx --yes firebase-tools@15.32.1 appdistribution:distribute dist/*.apk \
            --app "$FIREBASE_APP_ID" \
            "${TESTER_ARGS[@]}" \
            --release-notes "v1.0.${VERSION_CODE}：$(git log -1 --pretty=%s)"
