name: Android CI/CD

on:
  push:
    branches: ["**"]
    # 只改說明文件時不建置，省 Actions 分鐘數
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      release:
        description: "同時發佈到 Firebase App Tester"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      # 只有 main 與手動執行才建置 release APK；其他分支只跑測試與截圖，省下 R8 的時間
      BUILD_APK: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: 設定簽章金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::尚未設定 KEYSTORE_BASE64 secret，改用暫時的 debug 金鑰簽章；手機上將無法直接覆蓋更新。詳見 README。"
          fi

      - name: 設定 Firebase Crashlytics（若有提供 Secret）
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "已啟用 Crashlytics"
          else
            echo "::notice::尚未設定 GOOGLE_SERVICES_JSON，這次建置不含 Crashlytics。"
          fi

      - name: 單元測試、畫面截圖並建置 Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_APK" != true ]; then
            ./gradlew testDebugUnitTest --stacktrace
            exit 0
          fi
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MyWeather-1.0.${VERSION_CODE}.apk"

      # 畫面截圖只含測試用假資料，存成 artifact 方便檢查排版（保留 7 天）
      - name: 上傳畫面截圖
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 檢查 Firebase 服務帳戶金鑰
        id: firebase
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::notice::尚未設定 FIREBASE_SERVICE_ACCOUNT / FIREBASE_APP_ID，略過 App Tester 發佈。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e '.type == "service_account" and (.private_key | startswith("-----BEGIN PRIVATE KEY-----")) and (.client_email | length > 0)' > /dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 不是有效的服務帳戶 JSON。請把下載的 .json 檔『整份內容』（從 { 到 }）貼進 secret。"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.firebase.outputs.enabled == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 發佈到 Firebase App Distribution（App Tester）
        if: steps.firebase.outputs.enabled == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          TESTER_ARGS=()
          if [ -n "$FIREBASE_TESTERS" ]; then TESTER_ARGS=(--testers "$FIREBASE_TESTERS"); fi
          npx --yes firebase-tools@15.32.1 appdistribution:distribute dist/*.apk \
            --app "$FIREBASE_APP_ID" \
            "${TESTER_ARGS[@]}" \
            --release-notes "v1.0.${VERSION_CODE}：$(git log -1 --pretty=%s)"
