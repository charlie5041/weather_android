name: Android CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "同時發佈到 GitHub Release（讓手機自動更新）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 設定簽章金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::尚未設定 KEYSTORE_BASE64 secret，改用暫時的 debug 金鑰簽章；手機上將無法直接覆蓋更新。詳見 README。"
          fi

      - name: 建置 Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MyWeather-1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MyWeather-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: 發佈到 Firebase App Distribution（App Tester）
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::notice::尚未設定 FIREBASE_SERVICE_ACCOUNT / FIREBASE_APP_ID，略過 App Tester 發佈。"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          TESTER_ARGS=()
          if [ -n "$FIREBASE_TESTERS" ]; then TESTER_ARGS=(--testers "$FIREBASE_TESTERS"); fi
          npx --yes firebase-tools@latest appdistribution:distribute dist/*.apk \
            --app "$FIREBASE_APP_ID" \
            "${TESTER_ARGS[@]}" \
            --release-notes "v1.0.${VERSION_CODE}：$(git log -1 --pretty=%s)"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: 發佈到 GitHub Release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 我的天氣 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            自動建置：${{ github.sha }}（${{ github.ref_name }}）
            也可透過 Firebase App Tester 安裝更新。
